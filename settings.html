<html lang="pt">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Configurações
  </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   body {
      font-family: "Quicksand", sans-serif;
    }
  </style>
 </head>
 <body>
  <div class="min-h-screen bg-[#1f2233] relative text-white px-5 pt-8 pb-10">
   <img alt="Mapa de fundo mostrando América do Norte e do Sul em tons azul escuro" aria-hidden="true" class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none select-none" height="900" src="https://storage.googleapis.com/a1aa/image/7a933ebf-4e85-4f7e-0f1b-809de585c750.jpg" width="600"/>
   <div class="relative z-10 max-w-md mx-auto">
    <div class="flex items-center space-x-4 mb-8">
     <a href="dots.html" aria-label="Voltar" class="text-white text-2xl">
  <i class="fas fa-arrow-left"></i>
</a>
     <h1 class="text-xl font-normal">
      Configurações
     </h1>
    </div>
    <section class="mb-8">
     <p class="text-xs text-gray-400 mb-1">
      Conexão
     </p>
     <div class="flex justify-between items-center border-b border-gray-700 pb-4">
      <span class="text-lg font-normal">
       Conectar ao iniciar o Super VPN
      </span>
      <label class="relative inline-flex items-center cursor-pointer" for="connectToggle">
  <input aria-checked="false" class="sr-only peer" id="connectToggle" type="checkbox"/>
  <div class="w-11 h-6 bg-purple-800 rounded-full peer peer-focus:ring-2 peer-focus:ring-purple-600 peer-checked:bg-purple-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-pink-400 after:border-pink-400 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
</label>
     </div>
    </section>
    <section class="mb-8">
     <p class="text-xs text-gray-400 mb-1">
      Informações
     </p>
     <div class="flex justify-between items-center border-b border-gray-700 pb-4">
      <span class="text-lg font-normal">
       Notificações
      </span>
      <label class="relative inline-flex items-center cursor-pointer" for="notificationToggle">
       <input aria-checked="true" checked class="sr-only peer" id="notificationToggle" type="checkbox"/>
       <div class="w-11 h-6 bg-purple-800 rounded-full peer peer-focus:ring-2 peer-focus:ring-purple-600 peer-checked:bg-purple-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-pink-400 after:border-pink-400 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
      </label>
     </div>
    </section>
    <section class="mb-8">
     <p class="text-xs text-gray-400 mb-1">
      Configurações adicionais
     </p>
     <p class="text-lg font-normal mb-3">
      Selecionar protocolo
     </p>
     <button class="w-full text-left bg-[#2a2e42] rounded-lg py-3 px-4 text-white text-lg font-normal" type="button">
      AUTO
     </button>
    </section>
    <section class="mb-8">
     <p class="text-xs text-gray-400 mb-1">
      Opções de anúncios
     </p>
     <div class="flex justify-between items-center">
      <span class="text-lg font-normal">
       Silenciar anúncios em vídeo (necessário reiniciar o app)
      </span>
      <label class="relative inline-flex items-center cursor-pointer" for="adsMuteToggle">
  <input aria-checked="false" class="sr-only peer" id="adsMuteToggle" type="checkbox"/>
  <div class="w-11 h-6 bg-purple-800 rounded-full peer peer-focus:ring-2 peer-focus:ring-purple-600 peer-checked:bg-purple-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-pink-400 after:border-pink-400 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
</label>
     </div>
    </section>
    <section class="mb-6">
     <p class="text-lg font-normal">
      Política de Privacidade e Termos de Serviço
     </p>
    </section>
    <section>
     <p class="text-lg font-normal">
      Sobre nós
     </p>
    </section>
   </div>
  </div>
 </body>
</html>
