<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Módulo Ativado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ec0000; /* Alterado de laranja para vermelho */
      color: white;
    }
  </style>
</head>
<body class="relative min-h-screen bg-[#ec0000] flex items-start justify-center pt-32">
  <!-- Imagem fixa no topo -->
  <img src="android.png" alt="Ícone do Android" class="absolute top-0 left-1/2 transform -translate-x-1/2 mt-4" width="250" height="250"/>

  <!-- Conteúdo principal centralizado -->
  <div class="container bg-[#ec0000] p-4 rounded-lg shadow-lg max-w-sm text-center flex flex-col items-center">
    <h1 class="text-3xl font-bold mb-1">Módulo Ativado</h1>
    <p class="mb-4 text-sm">Mantenha o módulo instalado para garantir a proteção do seu dispositivo 24 horas por dia.</p>
    <img src="1ative.png" alt="Check verde indicando módulo ativado" width="250" height="250" class="mx-auto"/>
  </div>
</body>
</html>
