<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   ZyberVPN
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: "Poppins", sans-serif;
    }
  </style>
 </head>
 <body class="bg-[#1f2433] min-h-screen flex flex-col items-center relative overflow-hidden">
  <img 
    alt="Map background showing North and South America in dark blue shades" 
    aria-hidden="true" 
    class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none select-none z-0" 
    src="https://storage.googleapis.com/a1aa/image/7a933ebf-4e85-4f7e-0f1b-809de585c750.jpg" 
  />
  <header class="w-full flex items-center justify-between px-4 py-3 text-white text-lg relative">
   <a href="dots.html" aria-label="Menu" class="text-white text-2xl">
  <i class="fas fa-bars"></i>
</a>
   <h1 class="text-white text-xl font-normal absolute left-1/2 -translate-x-1/2">
    ZyberVPN
   </h1>
   <div class="flex items-center space-x-6 text-white text-xl">
    <a href="https://play.google.com/store/apps?hl=pt_BR" aria-label="Crown icon" class="opacity-80">
  <i class="fas fa-crown"></i>
</a>
    <button id="shareBtn" aria-label="Share icon" class="opacity-80">
  <i class="fas fa-share-alt"></i>
</button>
   </div>
  </header>
  <main class="flex flex-col items-center mt-8 w-full max-w-sm px-4">
   <div class="relative w-full max-w-[280px]">
  <button id="serverBtn" aria-label="Selected server dropdown"
    class="flex justify-between items-center bg-[#2f3445] rounded-full px-5 py-2 text-gray-300 text-lg font-light w-full">
    <div class="flex items-center space-x-2">
      <img id="serverFlag" alt="Flag of Czechia" class="w-6 h-6 rounded-full" src="https://flagcdn.com/w40/us.png" />
      <span id="serverName" class="select-none">California</span>
    </div>
    <i class="fas fa-chevron-down text-gray-400"></i>
  </button>

  <!-- Menu suspenso -->
  <ul id="serverMenu" class="absolute top-full left-0 mt-2 w-full bg-[#2f3445] rounded-lg shadow-lg text-gray-300 text-base font-light hidden z-10">
    <li class="px-4 py-2 hover:bg-[#3a3f50] cursor-pointer" data-name="Texas" data-flag="https://flagcdn.com/w40/us.png">Texas</li>
    <li class="px-4 py-2 hover:bg-[#3a3f50] cursor-pointer" data-name="Florida" data-flag="https://flagcdn.com/w40/us.png">Florida</li>
    <li class="px-4 py-2 hover:bg-[#3a3f50] cursor-pointer" data-name="New York" data-flag="https://flagcdn.com/w40/us.png">New York</li>
    <li class="px-4 py-2 hover:bg-[#3a3f50] cursor-pointer" data-name="Illinois" data-flag="https://flagcdn.com/w40/us.png">Illinois</li>
    <li class="px-4 py-2 hover:bg-[#3a3f50] cursor-pointer" data-name="Arizona" data-flag="https://flagcdn.com/w40/us.png">Arizona</li>
	<li class="px-4 py-2 hover:bg-[#3a3f50] cursor-pointer" data-name="California" data-flag="https://flagcdn.com/w40/us.png">California</li>
  </ul>
</div>
   <button id="connectBtn" aria-label="Connect button with check icon"
  class="relative mt-10 w-36 h-36 rounded-full bg-gray-600 flex items-center justify-center transition-all duration-500">
  <div class="relative w-28 h-28 rounded-full bg-gray-700 flex items-center justify-center">
    <i class="fas fa-check text-white text-5xl"></i>
  </div>
</button>
   <p id="statusText" class="mt-6 text-red-500 text-base font-light select-none">
  não conectado
</p>
  </main>
 </body>
 
 <script>
  const btn = document.getElementById('connectBtn');
  const statusText = document.getElementById('statusText');
  let isActive = false;
  let seconds = 0;
  let timer;

  function formatTime(sec) {
    const min = Math.floor(sec / 60);
    const s = sec % 60;
    return `${min.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function updateButton(active) {
    if (active) {
      btn.className = "relative mt-10 w-36 h-36 rounded-full bg-gradient-to-tr from-[#f76b1c] via-[#f73f8a] to-[#f73f8a] flex items-center justify-center shadow-[0_0_30px_#f73f8a] transition-all duration-500";
      btn.innerHTML = `
        <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-[#3a00f7] to-[#3a00f7] opacity-90 blur-[15px]"></div>
        <div class="relative w-28 h-28 rounded-full bg-gradient-to-tr from-[#f76b1c] via-[#f73f8a] to-[#f73f8a] flex items-center justify-center">
          <i class="fas fa-check text-white text-5xl"></i>
        </div>
      `;
    } else {
      btn.className = "relative mt-10 w-36 h-36 rounded-full bg-gray-600 flex items-center justify-center transition-all duration-500";
      btn.innerHTML = `
        <div class="relative w-28 h-28 rounded-full bg-gray-700 flex items-center justify-center">
          <i class="fas fa-check text-white text-5xl"></i>
        </div>
      `;
    }
  }

  function updateStatus(active) {
    if (active) {
      seconds = 0;
      statusText.classList.remove("text-red-500");
      statusText.classList.add("text-gray-400");
      statusText.textContent = formatTime(seconds);
      timer = setInterval(() => {
        seconds++;
        statusText.textContent = formatTime(seconds);
      }, 1000);
    } else {
      clearInterval(timer);
      statusText.classList.remove("text-gray-400");
      statusText.classList.add("text-red-500");
      statusText.textContent = "não conectado";
    }
  }

  btn.addEventListener('click', () => {
    isActive = !isActive;
    updateButton(isActive);
    updateStatus(isActive);
  });
</script>
<script>
  const serverBtn = document.getElementById('serverBtn');
  const serverMenu = document.getElementById('serverMenu');
  const serverName = document.getElementById('serverName');
  const serverFlag = document.getElementById('serverFlag');

  // Alternar visibilidade do menu
  serverBtn.addEventListener('click', () => {
    serverMenu.classList.toggle('hidden');
  });

  // Selecionar servidor
  serverMenu.querySelectorAll('li').forEach(item => {
    item.addEventListener('click', () => {
      const name = item.getAttribute('data-name');
      const flag = item.getAttribute('data-flag');
      serverName.textContent = name;
      serverFlag.src = flag;
      serverMenu.classList.add('hidden');
    });
  });

  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    if (!serverBtn.contains(e.target)) {
      serverMenu.classList.add('hidden');
    }
  });
</script>
<script>
  document.getElementById('shareBtn').addEventListener('click', async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'ZyberVPN',
          text: 'Confira este app de VPN incrível!',
          url: window.location.href // ou qualquer URL que você queira compartilhar
        });
        console.log('Compartilhado com sucesso!');
      } catch (error) {
        console.error('Erro ao compartilhar:', error);
      }
    } else {
      alert('Compartilhamento não suportado neste navegador.');
    }
  });
</script>
</html>
